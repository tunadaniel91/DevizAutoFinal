name: Build DevizAuto (Win + macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ✅ 1. Instalăm dependențele
      - name: Install deps
        run: npm install

      # ✅ 2. Construim TypeScript înainte de electron-builder
      - name: Build main process
        run: npm run build:main

      - name: Build renderer process
        run: npm run build:renderer

      # ✅ 3. Reconstruim better-sqlite3 pentru Electron 22
      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      # ✅ 4. Construim installerul final
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      # ✅ 5. Urcăm fișierul .exe rezultat
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevizAuto-Windows
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 🧩 Creăm un mediu virtual Python și instalăm tool-urile lipsă
      - name: Setup Python build env
        run: |
          brew update
          brew install python-setuptools
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip setuptools wheel

      # 🧱 Compilăm better-sqlite3 pentru Electron
      - name: Install deps and rebuild native modules
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          npm_config_build_from_source: true
        run: |
          npm install
          npx electron-rebuild -f -w better-sqlite3

      # 🍏 Construim .dmg-ul final
      - name: Build macOS dmg
        run: npx electron-builder --mac dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevizAuto-macOS
          path: dist/*.dmg