name: Build DevizAuto (Win + macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevizAuto-Windows
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 🧩 Fix: instalăm tot ce trebuie pentru a compila better-sqlite3
      - name: Install build tools for better-sqlite3
        run: |
          brew update
          brew install python-setuptools
          python3 -m ensurepip --upgrade
          python3 -m pip install setuptools wheel
          sudo xcode-select --install || true

      # 🧱 Instalăm dependențele și compilăm better-sqlite3 pentru Electron
      - name: Install deps and rebuild native modules
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          npm_config_build_from_source: true
        run: |
          npm install
          npx electron-rebuild -f -w better-sqlite3

      # 🧰 Construim aplicația .dmg
      - name: Build macOS dmg
        run: npx electron-builder --mac dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevizAuto-macOS
          path: dist/*.dmg
